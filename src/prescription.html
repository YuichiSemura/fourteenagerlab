<html lang="ja">
  <head>
    <link rel="icon" type="image/x-icon" href="./assets/14l-favicon.png" />
    <meta
      name="viewport"
      content="width=device-width, initial-scale=1, shrink-to-fit=no"
    />
    <meta
      content="YuichiSemura による、当たり障りしかないポートフォリオサイト。"
      name="description"
    />
    <meta charset="utf-8" />
    <meta property="og:title" content="FOURTEENAGER Lab." />
    <meta
      property="og:description"
      content="YuichiSemura による、当たり障りしかないポートフォリオサイト。"
    />
    <meta property="og:type" content="website" />
    <meta
      property="og:url"
      content="https://yuichisemura.github.io/fourteenagerlab/"
    />
    <meta
      property="og:image"
      content="https://yuichisemura.github.io/fourteenagerlab/assets/14l-favicon.png"
    />
    <meta property="og:site_name" content="FOURTEENAGER Lab." />
    <meta property="og:locale" content="ja_JP" />
    <title>Prescription - FOURTEENAGER Lab.</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Marcellus+SC&family=Zen+Antique+Soft&family=Zen+Old+Mincho:wght@400;600&display=swap"
      rel="stylesheet"
    />
    <style>
      /* CSS より先に効かせる読み込み画面（読み込み完了で prescription.js が消す） */
      html,
      body {
        background-color: #000;
      }
      .loading {
        position: fixed;
        inset: 0;
        z-index: 80;
        background-color: #000;
        transition: opacity 1s, visibility 1s;
      }
      .loading.loading__done {
        opacity: 0;
        visibility: hidden;
      }
    </style>
  </head>

  <body>
    <div class="loading" aria-hidden="true"><p>NOW LOADING</p></div>

    <div class="novel">
      <!-- 背景（2 枚を重ねて入れ替える） -->
      <div class="stage" aria-hidden="true">
        <div class="stage_bg"></div>
        <div class="stage_bg"></div>
        <div class="stage_tint"></div>
      </div>

      <!-- タイトル画面 -->
      <section class="title" aria-labelledby="title-name">
        <div class="title_logo">
          <p class="title_series">Fourteenager Lab.</p>
          <h1 class="title_name" id="title-name">Prescription</h1>
          <p class="title_sub">～青春を患った大人のための処方箋～</p>
        </div>
        <nav class="title_menu" aria-label="メニュー">
          <button type="button" data-action="start">はじめから</button>
          <button type="button" data-action="load">つづきから</button>
          <button type="button" data-action="config">設定</button>
          <a href="./index.html">サイトへもどる</a>
        </nav>
        <p class="title_copy">© 2020-2025 FOURTEENAGER Lab.</p>
      </section>

      <!-- 本編 -->
      <section class="game" aria-label="本編" hidden>
        <div class="nvl" hidden><div class="nvl_page"></div></div>
        <div class="adv">
          <p class="adv_name"></p>
          <p class="adv_text"></p>
          <span class="adv_next" aria-hidden="true" hidden>▼</span>
        </div>
        <nav class="quick" aria-label="操作">
          <button type="button" data-action="auto" aria-pressed="false">
            Auto
          </button>
          <button type="button" data-action="skip" aria-pressed="false">
            Skip
          </button>
          <button type="button" data-action="log">Log</button>
          <button type="button" data-action="save">Save</button>
          <button type="button" data-action="load">Load</button>
          <button type="button" data-action="config">Config</button>
          <button type="button" data-action="title">Title</button>
        </nav>
        <p class="novel_live visually-hidden" aria-live="polite"></p>
        <p class="card" aria-live="polite" hidden></p>
      </section>

      <!-- 読み返し -->
      <section
        class="sheet log"
        role="dialog"
        aria-modal="true"
        aria-labelledby="log-h"
        hidden
      >
        <header class="sheet_head">
          <h2 id="log-h">これまでの文章</h2>
          <button type="button" class="sheet_close" data-action="close">
            もどる
          </button>
        </header>
        <ol class="log_list"></ol>
      </section>

      <!-- セーブ・ロード -->
      <section
        class="sheet saves"
        role="dialog"
        aria-modal="true"
        aria-labelledby="saves-h"
        hidden
      >
        <header class="sheet_head">
          <h2 id="saves-h">ロード</h2>
          <button type="button" class="sheet_close" data-action="close">
            もどる
          </button>
        </header>
        <ol class="slots"></ol>
      </section>

      <!-- 設定 -->
      <section
        class="sheet config"
        role="dialog"
        aria-modal="true"
        aria-labelledby="config-h"
        hidden
      >
        <header class="sheet_head">
          <h2 id="config-h">設定</h2>
          <button type="button" class="sheet_close" data-action="close">
            もどる
          </button>
        </header>
        <div class="config_list">
          <label class="config_row">
            <span>文字の速さ</span>
            <input type="range" name="textSpeed" min="0" max="80" step="4" />
            <span class="config_hint">右ほど速い（いちばん右は一瞬）</span>
          </label>
          <label class="config_row">
            <span>オートの待ち時間</span>
            <input
              type="range"
              name="autoWait"
              min="400"
              max="4000"
              step="200"
            />
            <span class="config_hint">右ほどゆっくり</span>
          </label>
          <label class="config_row">
            <span>窓の濃さ</span>
            <input type="range" name="windowAlpha" min="30" max="95" step="5" />
            <span class="config_hint">右ほど背景が隠れる</span>
          </label>
        </div>
        <p class="config_keys">
          クリック・Enter で次へ／右クリック・Esc
          で窓を隠す／ホイールを上に回すと読み返し／Ctrl
          を押している間はスキップ
        </p>
      </section>

      <!-- 確認 -->
      <div class="confirm" role="alertdialog" aria-modal="true" hidden>
        <div class="confirm_box">
          <p class="confirm_text"></p>
          <div class="confirm_buttons">
            <button type="button" data-answer="yes">はい</button>
            <button type="button" data-answer="no">いいえ</button>
          </div>
        </div>
      </div>
    </div>

    <div class="site-grain" aria-hidden="true"></div>
  </body>

  <script type="module" src="./js/prescription.js"></script>
</html>
